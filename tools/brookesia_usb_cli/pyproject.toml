[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brookesia-usb-cli"
version = "0.1.0"
description = "Host CLI for the ESP-Brookesia USB Serial/JTAG control service"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Espressif Systems (Shanghai) Co., Ltd." }]
requires-python = ">=3.9"
dependencies = ["pyserial>=3.5"]
keywords = ["esp-brookesia", "usb", "serial-jtag", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: System :: Hardware",
]

[project.urls]
Homepage = "https://github.com/espressif/esp-brookesia"
Repository = "https://github.com/espressif/esp-brookesia.git"
Issues = "https://github.com/espressif/esp-brookesia/issues"

[project.scripts]
brookesia-usb = "brookesia_usb_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
